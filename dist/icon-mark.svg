<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sheetGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064e3b" flood-opacity="0.28" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Invoice Sheet with Subtle Shadow -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="96" width="220" height="290" rx="28" fill="url(#sheetGradient)" />
    
    <!-- Header Accent Bar -->
    <rect x="146" y="136" width="100" height="22" rx="11" fill="#059669" />
    
    <!-- Invoice Content Rows -->
    <rect x="146" y="184" width="160" height="16" rx="8" fill="#cbd5e1" />
    <rect x="146" y="222" width="160" height="16" rx="8" fill="#cbd5e1" />
    <rect x="146" y="260" width="100" height="16" rx="8" fill="#cbd5e1" />
    
    <!-- Rupee Icon on Invoice -->
    <g transform="translate(146, 298)">
      <text font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#059669" x="0" y="38">₹</text>
    </g>
  </g>

  <!-- GST Verified Floating Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="366" cy="366" r="92" fill="url(#badgeGradient)" stroke="#ffffff" stroke-width="22" />
    <!-- Crisp Checkmark -->
    <path d="M328 368 L354 394 L408 340" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
