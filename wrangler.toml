name = "kannaku"
compatibility_date = "2026-08-26"
pages_build_output_dir = "dist"

# Assets directory for Cloudflare Workers & Pages
[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 Serverless SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "kannaku_saas_prod"
database_id = "d1-kannaku-prod-d891b2c4-8841-47a2"
migrations_dir = "src/db"

# Cloudflare KV Storage for fast edge caching & session tokens
[[kv_namespaces]]
binding = "SESSION_KV"
id = "kv-kannaku-sessions-89a1"

# Environment Variables for Edge Functions
[vars]
ENVIRONMENT = "production"
API_VERSION = "v4.2.0"
APP_NAME = "Kannaku Multi-Tenant GST ERP"
APP_URL = "https://kannaku.pages.dev"
DEFAULT_CURRENCY = "INR"
