    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "JustGST",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "GST billing and invoicing software for Indian small businesses.",
      "offers": {
        "@type": "Offer",
        "price": "49",
        "priceCurrency": "INR",
        "validFrom": "2025-01-01T00:00:00+05:30",
        "priceValidUntil": "2028-12-31",
        "availability": "https://schema.org/InStock",
        "url": "https://justgst.in/",

          "@type": "OfferShippingDetails",
          "shippingRate": {
            "@type": "MonetaryAmount",

              "@type": "QuantitativeValue",
              "minValue": 0,
              "maxValue": 0,
              "unitCode": "DAY"
            }
          }
        },
        "hasMerchantReturnPolicy": {
          "@type": "MerchantReturnPolicy",
          "applicableCountry": "IN",
          "returnPolicyCategory": "https://schema.org/MerchantReturnNotPermitted",
          "merchantReturnDays": 0
        }

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('JustGST Service Worker registered with scope:', registration.scope);
            })
            .catch(function(error) {
              console.error('JustGST Service Worker registration failed:', error);
            });
        });
      }
