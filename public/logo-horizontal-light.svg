<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="darkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="darkSheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <linearGradient id="darkBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Brand Icon Badge (New Rupee Invoice + Verified Badge Mark) -->
  <g transform="translate(0, 0)">
    <!-- Base Rounded Squircle -->
    <rect width="64" height="64" rx="16" fill="url(#darkBgGrad)" />

    <!-- Invoice Sheet -->
    <rect x="14.5" y="12" width="27.5" height="36.25" rx="3.5" fill="url(#darkSheetGrad)" />
    <!-- Header Accent Bar -->
    <rect x="18.25" y="17" width="12.5" height="2.75" rx="1.375" fill="#059669" />
    <!-- Invoice Lines -->
    <rect x="18.25" y="23" width="20" height="2" rx="1" fill="#cbd5e1" />
    <rect x="18.25" y="27.75" width="20" height="2" rx="1" fill="#cbd5e1" />
    <!-- Rupee Icon on Invoice -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#059669" x="18.25" y="43">₹</text>

    <!-- GST Verified Floating Circle Badge -->
    <circle cx="45.75" cy="45.75" r="11.5" fill="url(#darkBadgeGrad)" stroke="#ffffff" stroke-width="2.75" />
    <!-- Crisp Checkmark -->
    <path d="M41 46l3.25 3.25 6.75-6.75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Wordmark & Subtitle for Dark Backgrounds (Original Typography Kept) -->
  <g transform="translate(80, 0)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.75">
      <tspan fill="#ffffff">Just</tspan><tspan fill="#34d399">GST</tspan>
    </text>
    <text x="1" y="54" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="2.5" fill="#cbd5e1" text-transform="uppercase">
      GST BILLING &amp; INVOICING
    </text>
  </g>
</svg>
