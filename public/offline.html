<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <title>No Connection — JustGST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ecfdf5;
      border: 2px solid #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #059669;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #059669;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn-retry {
      width: 100%;
      background-color: #059669;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }
    .btn-retry:hover {
      background-color: #047857;
    }
    .btn-retry:active {
      transform: scale(0.98);
      background-color: #065f46;
    }
    .tips {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      width: 100%;
    }
    .tips ul {
      margin-left: 18px;
      margin-top: 6px;
    }
    .tips li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
      JustGST
    </div>

    <div class="icon-wrapper">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>No Internet Connection</h1>
    <p>You appear to be offline. Check your Wi-Fi or mobile data connection and try again.</p>

    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Try Again
    </button>

    <div class="tips">
      <strong>Troubleshooting Tips:</strong>
      <ul>
        <li>Toggle Airplane mode on and off</li>
        <li>Check your Wi-Fi router or cellular signal</li>
        <li>Saved invoices are securely preserved in cache</li>
      </ul>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.innerHTML = 'Connecting...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';

      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(function() {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Try Again';
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';
        }, 800);
      }
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
