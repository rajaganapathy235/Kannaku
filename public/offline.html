<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <title>No Connection — JustGST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .illustration-container {
      width: 100%;
      max-width: 220px;
      height: 140px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .illustration-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes floatPlug {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-2deg); }
    }
    @keyframes floatSocket {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(4px) rotate(2deg); }
    }
    @keyframes sparkFlicker {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.1); }
    }
    .pulse-bg {
      transform-origin: center;
      animation: pulseRing 3s ease-in-out infinite;
    }
    .plug-left {
      transform-origin: center;
      animation: floatPlug 3.5s ease-in-out infinite;
    }
    .socket-right {
      transform-origin: center;
      animation: floatSocket 3.5s ease-in-out infinite;
    }
    .spark-effect {
      transform-origin: center;
      animation: sparkFlicker 2s ease-in-out infinite;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #059669;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn-retry {
      width: 100%;
      background-color: #059669;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }
    .btn-retry:hover {
      background-color: #047857;
    }
    .btn-retry:active {
      transform: scale(0.98);
      background-color: #065f46;
    }
    .tips {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #94a3b8;
      text-align: left;
      width: 100%;
    }
    .tips ul {
      margin-left: 18px;
      margin-top: 6px;
    }
    .tips li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
      JustGST
    </div>

    <div class="illustration-container">
      <svg class="illustration-svg" viewBox="0 0 260 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
          </linearGradient>
          <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="100%" stop-color="#0f172a" />
          </linearGradient>
          <linearGradient id="amberSpark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
          <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ecfdf5" stop-opacity="1" />
            <stop offset="65%" stop-color="#d1fae5" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>
          <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Background Ambient Ring -->
        <circle class="pulse-bg" cx="130" cy="70" r="58" fill="url(#auraGrad)" />
        <circle cx="130" cy="70" r="50" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />

        <!-- LEFT SIDE: Plug & Cable -->
        <g class="plug-left">
          <!-- Wire -->
          <path d="M10 70 Q 40 70, 60 70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none" />
          <!-- Cable Boot -->
          <rect x="56" y="65" width="10" height="10" rx="3" fill="#64748b" />
          <!-- Plug Body -->
          <rect x="66" y="52" width="34" height="36" rx="8" fill="url(#darkGrad)" />
          <!-- Brand Accent Stripe on Plug -->
          <rect x="70" y="55" width="4" height="30" rx="2" fill="url(#emeraldGrad)" />
          <!-- Prongs (Metal Pins) -->
          <rect x="100" y="58" width="16" height="6" rx="2" fill="#cbd5e1" />
          <rect x="100" y="76" width="16" height="6" rx="2" fill="#cbd5e1" />
          <circle cx="112" cy="61" r="1.5" fill="#64748b" />
          <circle cx="112" cy="79" r="1.5" fill="#64748b" />
        </g>

        <!-- RIGHT SIDE: Socket & Cable -->
        <g class="socket-right">
          <!-- Wire -->
          <path d="M200 70 Q 220 70, 250 70" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none" />
          <!-- Cable Boot -->
          <rect x="194" y="65" width="10" height="10" rx="3" fill="#64748b" />
          <!-- Socket Body -->
          <rect x="160" y="52" width="34" height="36" rx="8" fill="url(#emeraldGrad)" />
          <!-- Socket Face Plate -->
          <rect x="156" y="50" width="8" height="40" rx="3" fill="#047857" />
          <!-- Socket Entry Slots -->
          <rect x="158" y="58" width="4" height="6" rx="1" fill="#064e3b" />
          <rect x="158" y="76" width="4" height="6" rx="1" fill="#064e3b" />
          <!-- Small indicator LED -->
          <circle cx="184" cy="70" r="3" fill="#ef4444" opacity="0.9" />
        </g>

        <!-- CENTER: Disconnection Sparks & Signal Disconnect Icon -->
        <g class="spark-effect">
          <!-- Small disconnect lightning spark -->
          <path d="M132 54 L126 64 L134 64 L128 76" stroke="url(#amberSpark)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)" />
          <!-- Broken signal crosses / particles -->
          <circle cx="122" cy="48" r="2.5" fill="#f59e0b" />
          <circle cx="138" cy="88" r="2.5" fill="#10b981" />
          <circle cx="144" cy="46" r="1.5" fill="#059669" />
          <circle cx="116" cy="90" r="1.5" fill="#f59e0b" />
        </g>
      </svg>
    </div>

    <h1>No Internet Connection</h1>
    <p>You appear to be offline. Check your Wi-Fi or mobile data connection and try again.</p>

    <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Try Again
    </button>

    <div class="tips">
      <strong>Troubleshooting Tips:</strong>
      <ul>
        <li>Toggle Airplane mode on and off</li>
        <li>Check your Wi-Fi router or cellular signal</li>
        <li>Saved invoices are securely preserved in cache</li>
      </ul>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      btn.innerHTML = 'Connecting...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';

      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(function() {
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg> Try Again';
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'auto';
        }, 800);
      }
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
